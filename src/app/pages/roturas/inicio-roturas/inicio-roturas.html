<div class="mt-10">
    <div class="w-full mx-auto  px-5 py-3 bg-black md:w-fit md:rounded-sm">
        <p class="text-white text-center">
            Roturas Creadas
        </p>
    </div>
    <div class="h-100 overflow-y-auto md:mt-5 md:mx-auto md:w-250 md:overflow-x-auto">
        <table class="w-full border">
            <thead>
                <tr>|
                    <th>
                        Fecha
                    </th>
                    <th>
                        Codigo 
                    </th>
                    <th>
                        Nuid
                    </th>
                    <th>
                        N° Medidor
                    </th>
                    <th>
                        Rotura
                    </th>
                    <th>
                        Estado
                    </th>
                </tr>
            </thead>
            <tbody class="w-full text-center">
                @for (rotura of roturas; track rotura.id) {
                    <tr>
                        <td>
                            {{rotura.tuition_id}}
                        </td>
                        <td>
                            {{rotura.code}}
                        </td>
                        <td>
                            {{rotura.nuid}}
                        </td>
                        <td>
                            {{rotura.meter_number}}
                        </td>
                        <td>
                            {{rotura.rip_status ? 'SI' : 'NO'}}
                        </td>
                        <td>
                            {{rotura.status}}
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
