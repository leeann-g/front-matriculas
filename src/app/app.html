
<div class="min-h-screen bg-slate-100">

    <div class="flex min-h-screen">

        <!-- SIDEBAR -->
        <aside class="no-print fixed inset-y-0 left-0 z-50 hidden w-64 flex-col bg-slate-950 text-white lg:flex">

            <!-- LOGO -->
            <div class="flex flex-col items-center gap-3 border-b border-slate-800 px-5 py-8">
                <img
                    src="/images/logo1.svg"
                    alt="Logo"
                    class="h-20 w-20 object-contain bg-white rounded-full"
                >

                <h1 class="text-center text-lg font-bold">
                    SISTEMA DE GESTIÓN
                </h1>

                <p class="text-sm text-slate-400">
                    Matrículas y Roturas
                </p>
            </div>

            <!-- OPCIONES DEL MENÚ -->
            <nav class="flex flex-1 flex-col gap-2 px-4 py-6">

                <a
                    routerLink="/inicio"
                    routerLinkActive="bg-blue-600 text-white"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="rounded-xl px-4 py-3 font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white"
                >
                    🏠 Inicio
                </a>

                <a
                    routerLink="/inicio-matriculas"
                    routerLinkActive="bg-blue-600 text-white"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="rounded-xl px-4 py-3 font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white"
                >
                    📋 Matrículas
                </a>

                <a
                    routerLink="/inicio-roturas"
                    routerLinkActive="bg-blue-600 text-white"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="rounded-xl px-4 py-3 font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white"
                >
                    🔧 Roturas
                </a>
                <a
                    routerLink="/informe-roturas"
                    routerLinkActive="bg-blue-600 text-white"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="rounded-xl px-4 py-3 font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white"
                >
                    📊Reporte Roturas
                </a>

            </nav>

            <!-- CONFIGURACIÓN -->
            <div class="border-t border-slate-800 p-4">
                <a
                    routerLink="/configuracion"
                    routerLinkActive="bg-blue-600 text-white"
                    class="block rounded-xl px-4 py-3 font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white"
                >
                    ⚙️ Configuración
                </a>
            </div>

        </aside>


        <!-- CONTENIDO DERECHO -->
        <div class="min-w-0 w-full flex-1 lg:ml-64">

            <!-- ENCABEZADO MÓVIL -->
            <header class="flex items-center gap-3 bg-slate-950 px-4 py-4 text-white lg:hidden">

                <img
                    src="/images/logo1.svg"
                    alt="Logo"
                    class="h-10 w-10 object-contain"
                >

                <div>
                    <h1 class="font-bold">
                        SISTEMA DE GESTIÓN
                    </h1>

                    <p class="text-xs text-slate-400">
                        Matrículas y Roturas
                    </p>
                </div>

            </header>


            <!-- NAVEGACIÓN MÓVIL -->
            <nav class="flex gap-2 overflow-x-auto bg-slate-900 p-3 lg:hidden">

                <a
                    routerLink="/inicio"
                    routerLinkActive="bg-blue-600 text-white"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="shrink-0 rounded-lg px-4 py-2 text-sm font-semibold text-slate-300"
                >
                    Inicio
                </a>

                <a
                    routerLink="/inicio-matriculas"
                    routerLinkActive="bg-blue-600 text-white"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="shrink-0 rounded-lg px-4 py-2 text-sm font-semibold text-slate-300"
                >
                    Matrículas
                </a>

                <a
                    routerLink="/inicio-roturas"
                    routerLinkActive="bg-blue-600 text-white"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="shrink-0 rounded-lg px-4 py-2 text-sm font-semibold text-slate-300"
                >
                    Roturas
                </a>

                <a
                    routerLink="/configuracion"
                    routerLinkActive="bg-blue-600 text-white"
                    class="shrink-0 rounded-lg px-4 py-2 text-sm font-semibold text-slate-300"
                >
                    Configuración
                </a>

            </nav>


            <!-- ROUTER OUTLET -->
            <main class="w-full min-h-screen p-4 sm:p-6 lg:p-8">

                <router-outlet></router-outlet>

            </main>

        </div>

    </div>

</div>
