<div class="border">
    <div class="w-full mx-auto  px-5 py-3 bg-black md:w-fit md:rounded-sm">
        <p class="text-white text-center">
            Matriculas creadas
        </p>
    </div>
    <div class="h-100 overflow-y-auto md:mt-5 md:mx-auto md:w-250 2xl:w-400">
        <table class="w-full border">
            <thead>
                <tr>
                    <th>
                        Fecha
                    </th>
                    <th>
                        Codigo 
                    </th>
                    <th>
                        Nuid
                    </th>
                    <th>
                        N° Medidor
                    </th>
                    <th>
                        Rotura
                    </th>
                    <th>
                        Estado
                    </th>
                </tr>
            </thead>
            <tbody class="w-full text-center">
                @for (matricula of matriculas; track matricula.id) {
                    <tr>
                        <td>
                            {{matricula.date}}
                        </td>
                        <td>
                            {{matricula.code}}
                        </td>
                        <td>
                            {{matricula.nuid}}
                        </td>
                        <td>
                            {{matricula.meter_number}}
                        </td>
                        <td>
                            {{matricula.rip_status ? 'SI' : 'NO'}}
                        </td>
                        <td>
                            {{matricula.status}}
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
