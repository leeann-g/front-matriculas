<div class="md:mt-10">
    <div
        class="relative flex flex-col items-center justify-center w-full md:max-w-[1200px] md:min-h-[400px] md:rounded-4xl mx-auto px-4 py-6 rounded-md bg-black">

        <p class="font-bold text-sm text-center text-white sm:text-lg md:text-2xl lg:text-4xl">
            APLICATIVO DESARROLLADO PARA EL CONTROL Y LA GESTIÓN DE LAS MATRICULAS Y ROTURAS
        </p>

        <div class="logo-leon h-32 w-32 sm:h-40 sm:w-40 md:h-50 md:w-50 border">
            <img src="/images/logo1.svg" alt="">
        </div>
        <a routerLink="/formulario-matricula" class="px-4 py-2 rounded-2xl bg-white font-bold text-xl hover:bg-gray-500 hover:text-white hover:-translate-y-1">
            Crear Matricula
        </a>
    </div>
    <div class="w-fit mx-auto px-4 py-2 mt-10">
        <div class="border bg-black rounded-t-2xl">
            <p class="text-white text-center">
                PANEL DE INFORMACIÓN
            </p>
        </div>
        <div class="flex px-4 py-4 gap-5 rounded-b-lg bg-gray-300">
            <div class="">
                <div class="w-34 px-3 py-2 border bg-black rounded-t-2xl">
                    <p class="text-white text-center">MATRICULAS</p>
                </div>
                <div class="rounded-b-lg bg-white font-semibold text-2xl text-center">
                    {{conteoMatriculas}}
                </div>
            </div>
            <div class="">
                <div class="w-34 px-3 py-2 border rounded-t-2xl bg-black text-center text-white">
                    ROTURAS
                </div>
                <div class="rounded-b-lg bg-white font-semibold text-2xl text-center">
                    {{connteoRoturas}}
                </div>
            </div>
        </div>
    </div>
    <div class="flex flex-col items-center w-fit fixed bottom-0 right-0">
        <p class="font-bold">
            ⚙️Config⚙️
        </p>
        <div class="w-10 h-10 group">
            <div class="icono rounded-full">
                <a routerLink="/configuracion"><img src="/images/iconoConfig.png" alt="Configuracion"></a>
            </div>
        </div>
    </div>
</div>
